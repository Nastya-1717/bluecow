<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《外星人与蓝色奶牛》关键词版问卷</title><style>
:root{--bg:#fff8fb;--card:#fff;--ink:#332d38;--muted:#8b7d88;--line:#f0dfe9;--pink:#e66d9b;--pink2:#f4a7bf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8fb,#f5f3ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}.wrap{max-width:720px;margin:0 auto;padding:24px 15px 56px}.hero,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(190,103,141,.08)}.hero{padding:27px 23px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:5px 0;color:var(--muted)}.badge{display:inline-block;background:#ffedf4;color:#c84d7d;border-radius:999px;padding:3px 10px;font-size:13px}.card{padding:20px;margin:13px 0}.qno{color:var(--pink);font-weight:700;font-size:13px}.q{font-size:17px;font-weight:700;margin:3px 0 12px}.option{display:block;border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin:8px 0;cursor:pointer;background:#fff}.option:hover{border-color:#ed9cba;background:#fff8fb}.option input{margin-right:8px;accent-color:var(--pink)}button{width:100%;border:0;border-radius:15px;padding:13px 17px;font-size:16px;font-weight:700;background:var(--pink);color:#fff;cursor:pointer;margin-top:7px}#result{display:none}.resultbox{background:#fff9fc;border:1px dashed #e5a4bc;border-radius:16px;padding:18px}.small{font-size:13px;color:var(--muted)}.bar{height:9px;background:#f5e7ee;border-radius:99px;overflow:hidden;margin:5px 0 11px}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));width:0}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style></head><body><div class="wrap"><section class="hero"><span class="badge">关键词版 · 无剧透</span><h1>✨ 测测你是哪种奇怪队友</h1><p>会遇到一点调调、外星人和不太讲理的日常。</p><p>凭第一反应选，别试图研究出标准答案。</p></section><form id="quiz"></form><div class="card"><button type="button" onclick="calc()">交卷，看看你是哪一型 👀</button></div><section id="result" class="card"><h2>你的结果来啦</h2><div class="resultbox" id="resultText"></div><button type="button" onclick="location.reload()">重新测一下</button></section><footer>娱乐测试而已，最终分配还是听 KP 的～</footer></div><script>
const qs=[
["你打开 Procreate，发现类纸膜上自己长出了一行字：‘别画了，先去救人。’你会？",[["先把这句话记下来，再想想它为什么偏偏现在出现。","h1"],["画个传送门过去看看，反正都已经开始了。","h2"],["先确认要救的人在哪、安不安全，再出发。","h3"]]],
["你在星露谷里钓到一只鲤鱼王，它说自己其实是外星人。你会？",[["问它以前经历过什么，为什么要告诉我。","h1"],["先问它会不会带我去更稀有的地方。","h2"],["把它放进最舒服的池子里，先别让它被别人捞走。","h3"]]],
["速写班长在群里发通知：明天交一张‘我推的孩子被假面骑士追着跑’。你会？",[["先琢磨这个题目到底想让人画什么。","h1"],["好耶，越怪越好画，今晚直接开搞。","h2"],["先问班长有没有人没跟上，别让谁一个人着急。","h3"]]],
["你在名创优品买盲盒，拆出一个和自己一模一样的小人。你会？",[["观察它的表情和细节，想知道它是不是也有自己的想法。","h1"],["带它去再买十个，看看能不能组出一支队伍。","h2"],["先给它找个不容易摔坏的位置，回家再慢慢研究。","h3"]]],
["胃弱的你，被拉去吃山西刀削面、鲅鱼水饺，桌上还有冰淇淋红茶。你会？",[["先问每样东西背后的故事，听起来还挺有意思。","h1"],["都点！大不了明天再后悔，今天先吃。","h2"],["给自己点能吃的，也顺便帮大家记着别点太多。","h3"]]],
["DeepSeek 给你算出一个结果：你和一个陌生人是‘命中注定的搭档’。你会？",[["想知道它是根据哪些细节算出来的。","h1"],["那就去认识一下，万一真的很有意思呢。","h2"],["先看看对方愿不愿意，不能只听一个结果安排。","h3"]]],
["你推的角色突然在 ao3 的评论区回复你：‘我知道你做过什么。’你会？",[["先回忆自己写过的每句话，想知道它指的是什么。","h1"],["直接接梗：那你倒是说说看。","h2"],["先确认这是不是恶作剧，别让事情越变越危险。","h3"]]],
["ave mujica、邦多利、少女歌剧的舞台同时邀请你上台，你会选？",[["选那个最能讲清楚一段复杂故事的舞台。","h1"],["选最疯、最容易出意外的那个。","h2"],["选能和熟悉的人一起上台、互相照应的那个。","h3"]]]
];
const form=document.getElementById("quiz");qs.forEach((x,i)=>{const c=document.createElement("section");c.className="card";c.innerHTML=`<div class="qno">问题 ${i+1}</div><div class="q">${x[0]}</div>`;[...x[1]].sort(()=>Math.random()-.5).forEach(o=>c.innerHTML+=`<label class="option"><input type="radio" name="q${i}" value="${o[1]}"> ${o[0]}</label>`);form.appendChild(c)});
function calc(){let s={h1:0,h2:0,h3:0};for(let i=0;i<qs.length;i++){const a=document.querySelector(`input[name="q${i}"]:checked`);if(!a){alert("还有题没选哦～");return}s[a.value]++}const a=[["HO1",s.h1],["HO2",s.h2],["HO3",s.h3]].sort((x,y)=>y[1]-x[1]),t=a.filter(x=>x[1]===a[0][1]).map(x=>x[0]),d={HO1:`你会被奇怪事物背后的原因吸引。比起热闹本身，你更想知道它为什么发生、这个人到底在想什么，以及一段关系会走向哪里。<br><br><b>关键词：</b>细节、关系感、好奇心。`,HO2:`你很会把离谱当成机会。规则可以先放一边，能不能玩、能不能推进、能不能顺手搞出更大的动静，才是重点。<br><br><b>关键词：</b>行动派、灵活、搞事情。`,HO3:`你对自己人有很强的保护欲。嘴上可能嫌麻烦，但真到关键时刻，你会先确认对方没事，再处理剩下的一切。<br><br><b>关键词：</b>陪伴、责任感、护短。`};document.getElementById("resultText").innerHTML=`<h3>${t.length===1?`你的倾向是：${t[0]}`:`你的倾向是：${t.join(" × ")}`}</h3>${a.map(x=>`<div><b>${x[0]}</b>　${x[1]}/8<div class="bar"><div class="fill" style="width:${x[1]/8*100}%"></div></div></div>`).join("")}<hr style="border:0;border-top:1px solid #f0dfe9;margin:17px 0"><p>${d[a[0][0]]}</p><p class="small">分数接近也很正常，说明你是混合型选手～</p>`;document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth"})}
</script></body></html>
